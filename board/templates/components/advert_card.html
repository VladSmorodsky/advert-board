<div class="card mx-1" style="width: 18rem;">
    <div class="card-body">
        <div class="d-flex justify-content-between">
            <h5 class="card-title">{{ card.title }}</h5>
            <a href="?category_id={{ card.category.id }}"><span
                    class="badge bg-primary">{{ card.category.name }}</span></a>
        </div>
        <p class="card-text">{{ card.get_short_description }}...</p>
        <div class="d-flex justify-content-between">
            <a href="?user_id={{ card.user.id }}" class="card-link">{{ card.user.username }}</a>
            <a href="{% url 'advert_detail' card.id %}" class="card-link">Show more</a>
        </div>
    </div>
</div>
